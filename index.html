<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Вьетнам: Карта Выживания (GPS)</title>
  
<!-- Подключаем Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #map {
      width: 100%;
      height: 100vh;
    }
    /* Кастомная кнопка GPS на экране */
    .gps-btn {
      background: #ffcc00;
      color: #000;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Подключаем Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // Инициализация карты, центр — Вьетнам
    var map = L.map('map', {
      zoomControl: false // Перенесем зум вниз для удобства на телефоне
    }).setView([14.0583, 108.2772], 6);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Слой 1: Топографическая карта (лучшая для троп, рек и высот)
    var topoLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
      maxZoom: 17,
      attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap'
    });

    // Слой 2: Стандартная карта дорог OpenStreetMap
    var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    });

    // По умолчанию ставим топографическую (идеально для выживания)
    topoLayer.addTo(map);

    // Меню переключения слоев
    var baseLayers = {
      "🌲 Топография (Реки, Тропы)": topoLayer,
      "🛣️ Дороги (OSM)": osmLayer
    };
    L.control.layers(baseLayers, null, {position: 'topright'}).addTo(map);

    var userMarker = null;
    var accuracyCircle = null;

    // Функция отслеживания GPS в реальном времени
    function initGPS() {
      if (!navigator.geolocation) {
        alert("Геолокация не поддерживается вашим браузером");
        return;
      }

      navigator.geolocation.watchPosition(
        function(position) {
          var lat = position.coords.latitude;
          var lng = position.coords.longitude;
          var accuracy = position.coords.accuracy; // Точность в метрах

          var latLng = [lat, lng];

          if (!userMarker) {
            // Создаем маркер положения при первом определении
            userMarker = L.marker(latLng).addTo(map)
              .bindPopup("<b>Вы здесь!</b><br>Точность: " + Math.round(accuracy) + " м.")
              .openPopup();
            
            accuracyCircle = L.circle(latLng, { 
              radius: accuracy, 
              color: '#3388ff', 
              fillColor: '#3388ff', 
              fillOpacity: 0.2 
            }).addTo(map);

            map.setView(latLng, 14); // Приближаем к пользователю
          } else {
            // Обновляем координаты маркера и круга точности
            userMarker.setLatLng(latLng);
            accuracyCircle.setLatLng(latLng);
            accuracyCircle.setRadius(accuracy);
          }
        },
        function(error) {
          console.warn("Ошибка GPS: " + error.message);
        },
        {
          enableHighAccuracy: true, // Использовать GPS-модуль на максимум
          maximumAge: 0,
          timeout: 15000
        }
      );
    }

    // Добавляем кнопку "Найти меня" на карту
    var GpsControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function (map) {
        var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        var btn = L.DomUtil.create('a', 'gps-btn', container);
        btn.innerHTML = '🎯 GPS';
        btn.href = '#';
        btn.title = 'Центрировать на моем положении';

        L.DomEvent.on(btn, 'click', function(e) {
          L.DomEvent.stopPropagation(e);
          L.DomEvent.preventDefault(e);
          if (userMarker) {
            map.setView(userMarker.getLatLng(), 16);
          } else {
            initGPS();
            alert("Запрос GPS сигнала...");
          }
        });
        return container;
      }
    });
    map.addControl(new GpsControl());

    // Запуск GPS при загрузке страницы
    initGPS();
  </script>
</body>
</html>
